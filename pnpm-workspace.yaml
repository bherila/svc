packages:
  - '.'

# Keep per-worktree node_modules as links into pnpm's shared virtual store.
enableGlobalVirtualStore: true

allowBuilds:
  spotlight-noindex: true
  unrs-resolver: true

publicHoistPattern:
  - '@inertiajs/core'

overrides:
  # CVE in qs <6.16.0, reached only transitively: express 5.2.1 -> body-parser
  # 2.3.0, pulled by the shadcn CLI and the MCP SDK. Neither is on a request
  # path in this application - both are build-time tooling - but the lockfile is
  # what Dependabot reads, and there is no direct dependency to bump.
  qs: ^6.16.0
  # Stay on the existing transitive major versions while applying all published
  # brace-expansion, URI-normalization, and IP-address parsing security fixes.
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'ip-address@>=10.0.0 <10.7.1': 10.7.1

packages:
  - '.'

# Keep per-worktree node_modules as links into pnpm's shared virtual store.
enableGlobalVirtualStore: true

# Oxlint provides the ESLint-compatible plugin host. These plugin paths do not
# use the ESLint engine; keep their rules without auto-installing that peer.
# import/order is loaded on its own by tools/oxlint/import-order.mjs because
# the import plugin's full entrypoint also loads unrelated ESLint-only rules.
packageExtensions:
  '@stylistic/eslint-plugin@5.10.0':
    peerDependenciesMeta:
      eslint:
        optional: true
  'eslint-plugin-import@2.32.0':
    peerDependenciesMeta:
      eslint:
        optional: true
  'eslint-plugin-react-hooks@7.1.1':
    peerDependenciesMeta:
      eslint:
        optional: true
  '@eslint-community/eslint-utils@4.10.1':
    peerDependenciesMeta:
      eslint:
        optional: true

allowBuilds:
  # First-party; its postinstall only marks node_modules no-index on macOS.
  bwh-auth: true
  spotlight-noindex: true
  unrs-resolver: true

publicHoistPattern:
  - '@inertiajs/core'

overrides:
  # CVE in qs <6.16.0, reached transitively through the MCP SDK's
  # express -> body-parser tree. The SDK is test tooling, not on an application
  # request path, but the lockfile is what Dependabot reads and there is no
  # direct dependency to bump.
  qs: ^6.16.0
  # Stay on the existing transitive major versions while applying all published
  # brace-expansion, URI-normalization, and IP-address parsing security fixes.
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'ip-address@>=10.0.0 <10.7.4': 10.7.4

minimumReleaseAgeExclude:
  - bwh-auth

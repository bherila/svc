# Both database lanes use four independent shards, with four ParaTest workers each. Laravel gives
# each MariaDB worker an isolated `svc_testing_test_<token>` schema, created
# automatically by the root CI connection inside the ephemeral service container.
name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      portal_layout:
        description: Run the portal access browser layout pass
        type: boolean
        default: false
      correction_layout:
        description: Run the invoice correction browser layout pass
        type: boolean
        default: false
      square_layout:
        description: Run the Square explore and linked invoice browser layout pass
        type: boolean
        default: false
      reminder_layout:
        description: Run the payment reminder browser layout pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: svc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portal-layout:
    name: Portal access browser layout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.portal_layout }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser layout
        run: node scripts/check-layout.mjs --portal-access
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-access-layout
          path: test-results/layout/
          retention-days: 7

  correction-layout:
    name: Invoice correction browser layout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.correction_layout }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser layout
        run: node scripts/check-layout.mjs --invoice-correction
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invoice-correction-layout
          path: test-results/layout/
          retention-days: 7

  square-layout:
    name: Square browser layout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.square_layout }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser layout
        run: node scripts/check-layout.mjs --square
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: square-layout
          path: test-results/layout/
          retention-days: 7

  reminder-layout:
    name: Payment reminder browser layout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder_layout }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser layout
        run: node scripts/check-layout.mjs --reminders
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reminder-layout
          path: test-results/layout/
          retention-days: 7

  # Every screen group of the layout harness, on every pull request and push to main.
  # Each group renders its screens at 390, 820, 1440 and 1920 pixels in the light and
  # dark themes and fails on horizontal overflow, a wrapped navbar, any axe violation
  # at any impact, and any UI-consistency error. Shards run concurrently and build the
  # frontend once each; LayoutWorkflowTest fails if a group in scripts/check-layout.mjs
  # is missing from this matrix.
  layout:
    name: Layout and accessibility (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default screens
            groups: ''
          - name: invoice actions
            groups: '--invoice-actions --invoice-send'
          - name: invoice recovery
            groups: '--invoice-history --invoice-recovery --invoice-correction'
          - name: billing and connections
            groups: '--autopay --payments --credentials'
          - name: clients and portal access
            groups: '--clients --portal-access --reminders --disputes'
          - name: engagement and history
            groups: '--engagement --deferred-backlog --time --history --resource-chrome'
          - name: tasks and expenses
            groups: '--tasks --task-lookups --expenses --expense-schedules --receipts --projects'
          - name: dashboards and shared work
            groups: '--revenue --work-portal --shared-projects --reviewers --light-workspace --workspaces --square --invoice-document --palette'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the frontend once for the shard
        run: pnpm run build
      - name: Check browser layout and accessibility
        env:
          GROUPS_TO_RUN: ${{ matrix.groups }}
        run: |
          status=0
          if [ -z "$GROUPS_TO_RUN" ]; then
            node scripts/check-layout.mjs --skip-build || status=1
          else
            for group in $GROUPS_TO_RUN; do
              node scripts/check-layout.mjs --skip-build "$group" || status=1
            done
          fi
          exit $status
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-${{ strategy.job-index }}
          path: test-results/layout/
          retention-days: 7

  # The focused browser scripts with their own fixtures. Each checks the same widths and
  # both themes, and fails on the same axe and UI-consistency findings as the harness.
  layout-scripts:
    name: Layout and accessibility (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collaboration
            script: scripts/check-collaboration-layout.mjs
          - name: task organization
            script: scripts/check-task-organization-layout.mjs
          - name: attachment sharing
            script: scripts/check-attachment-sharing-layout.mjs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install dependencies
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
      - name: Prepare browser on the disposable runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the frontend
        run: pnpm run build
      - name: Check browser layout and accessibility
        env:
          LAYOUT_SCRIPT: ${{ matrix.script }}
          # check-attachment-sharing-layout.mjs runs its own Vite dev server, which
          # laravel-vite-plugin refuses to start under CI=true without this.
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: node "$LAYOUT_SCRIPT"
      - name: Upload synthetic screenshots and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-script-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  layout-gate:
    name: Layout and accessibility
    needs: [layout, layout-scripts]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every layout shard
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/require-success.sh

  checks:
    name: Static and frontend checks
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Cache downloaded archives only, never Composer auth or private VCS clones.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      - name: Setup Application
        run: composer setup

      - name: Test Codex setup decisions
        run: bash codex/setup.test.sh

      # The deploy job's pinned action, so the cron tests prove its installer's output is the
      # line cron-audit.sh accepts. DeploymentSafetyTest keeps every reference on one pin.
      - name: Resolve the pinned shared deployment tooling
        id: tooling
        uses: bherila/shared-cpanel-deployment/tooling@5798879af588e2c786357b69b314d89932b75803 # v2.6.0

      - name: Test deployment hooks
        env:
          SHARED_DEPLOY_ACTION_PATH: ${{ steps.tooling.outputs.path }}
        run: |
          for hook in scripts/deploy/*.sh tests/Deployment/*.sh; do bash -n "$hook"; done
          tests/Deployment/test-deploy-hooks.sh
          bash tests/Deployment/test-preflight.sh
          bash tests/Deployment/test-oauth-lifecycle.sh
          bash tests/Deployment/test-failure-report.sh
          bash tests/Deployment/test-mutation-scope.sh
          bash tests/Deployment/test-cron-audit.sh
          node --test tests/Deployment/verify-oauth-redirect.test.mjs tests/Deployment/verify-hashed-assets.test.mjs

      - name: Run CI Checks
        run: composer ci:checks

      - name: Upload frontend build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  sqlite:
    name: SQLite shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_EXPECT_DRIVER: sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      # Cache downloaded archives only, never Composer auth or private VCS clones.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      # No --prefer-dist: the private bridge dependency is authorised by the SSH
      # agent above, and a dist install would fetch it from the GitHub API
      # zipball instead, which that key does not authenticate.
      - name: Install Composer dependencies
        run: |
          composer install --no-interaction
          test -f .env || cp .env.example .env

      - name: Run the SQLite shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          php -d memory_limit=1G scripts/ci/phpunit-shard.php "$SHARD" 4 "$RUNNER_TEMP/phpunit-shard.xml"
          php -d memory_limit=1G artisan test --parallel --processes=4 --configuration="$RUNNER_TEMP/phpunit-shard.xml"

  mariadb-tests:
    name: MariaDB shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # The default suite runs on in-memory SQLite; production is MariaDB 11.4
    # reached through Laravel's `mariadb` driver. SQLite stores whatever it is
    # handed, so a value MariaDB refuses passes there without comment - which is
    # how a `h:mm` string written into a decimal column survived 404 green
    # tests. Every schema difference between the two engines is invisible until
    # the suite runs on the engine that ships.
    #
    # This lane is deliberately separate from SQLite rather than replacing its
    # database: SQLite keeps the local and CI feedback loop fast, and this run
    # is the one that has to be true.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: svc_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # PHPUnit's <env> entries do not overwrite variables already present in the
    # environment, so these win over the sqlite defaults in phpunit.xml without
    # needing a second config file to drift out of step.
    #
    # DB_EXPECT_DRIVER is not read by the application. It tells the suite what
    # this run is claiming to be, and DatabaseDriverTest fails if the claim is
    # wrong - otherwise a mistyped variable or a service container that never
    # came up would quietly fall back to SQLite and report a green run that
    # proved nothing.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: svc_testing
      DB_USERNAME: root
      DB_PASSWORD: testing
      DB_EXPECT_DRIVER: mariadb

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      # Cache downloaded archives only, never Composer auth or private VCS clones.
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      # No --prefer-dist: the private bridge dependency is authorised by the SSH
      # agent above, and a dist install would fetch it from the GitHub API
      # zipball instead, which that key does not authenticate.
      - name: Install Composer dependencies
        run: |
          composer install --no-interaction
          test -f .env || cp .env.example .env

      # No lint or static analysis here; `checks` runs those and they say
      # nothing about the engine. This job exists for the database alone.
      - name: Run the MariaDB shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          php -d memory_limit=1G scripts/ci/phpunit-shard.php "$SHARD" 4 "$RUNNER_TEMP/phpunit-shard.xml"
          php -d memory_limit=1G artisan test --parallel --processes=4 --configuration="$RUNNER_TEMP/phpunit-shard.xml"

  mcp-smoke:
    name: MCP SDK streamable HTTP smoke
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Install application and generate ephemeral OAuth keys
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          install -d -m 700 storage/app/private/oauth
          php artisan passport:keys --force

      - name: Run pinned SDK MCP smoke
        run: bash scripts/mcp-smoke-ci.sh

  mutation:
    name: Diff-scoped mutation tests
    if: ${{ github.event_name == 'pull_request' }}
    # Typical diffs should remain near the ten-minute target. This is only the
    # hard failsafe for unusually broad money-path changes: #125 generated
    # 1,407 mutants and was cancelled by the former 12-minute cap before
    # Infection could report a result.
    timeout-minutes: 45
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mutation-tested changes
        id: mutation_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source scripts/mutation-scope.sh
          mutation_scope "$BASE_SHA" "$HEAD_SHA"
          {
            echo "merge_base=$mutation_scope_base"
            echo "required=$mutation_scope_required"
            echo "changed_count=$mutation_scope_files"
          } >> "$GITHUB_OUTPUT"
          if [ "$mutation_scope_required" = false ]; then
            echo "::notice title=Mutation gate not applicable::No added or changed surviving PHP application lines under app/ (including deletion-only diffs)."
            {
              echo "### Mutation gate"
              echo
              echo "Not applicable: no added or changed surviving PHP application lines under \`app/\` (including deletion-only diffs). No mutation summary or score is produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Mutation gate"
              echo
              echo "Running changed-line mutation analysis for $mutation_scope_files PHP application source file(s)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup PHP with coverage
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Install Composer dependencies
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        run: composer install --no-interaction

      - name: Run mutations on changed lines
        id: mutation_run
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        env:
          MUTATION_BASE: ${{ steps.mutation_scope.outputs.merge_base }}
        # The score is advisory (docs/client-management/mutation-testing.md),
        # so a red Infection exit does not fail the job. The measurement gate
        # in the next step does.
        continue-on-error: true
        run: composer test:mutation-diff

      - name: Gate on mutants actually measured
        if: ${{ always() && steps.mutation_scope.outputs.required == 'true' }}
        env:
          MUTATION_OUTCOME: ${{ steps.mutation_run.outcome }}
        run: |
          summary=storage/framework/cache/infection-diff/summary.json
          echo "Infection outcome: $MUTATION_OUTCOME"
          {
            echo
            echo "Infection outcome: **$MUTATION_OUTCOME**."
          } >> "$GITHUB_STEP_SUMMARY"

          # Fails when the summary is missing or more than half the mutants
          # timed out or were skipped (#443); writes the counts to the summary.
          php scripts/mutation-gate.php "$summary"

          if [ -f "$summary" ]; then
            total=$(jq -r '.stats.totalMutantsCount' "$summary")
            covered_msi=$(jq -er '.stats.coveredCodeMsi // .coveredCodeMutationScoreIndicator' "$summary")
            echo "Covered-code MSI: **$covered_msi%**." >> "$GITHUB_STEP_SUMMARY"
            if [ "$total" -eq 0 ]; then
              echo "::notice title=Mutation gate produced zero mutants::The changed PHP source was analyzed, but no covered changed line produced a mutant."
              {
                echo
                echo "No mutants were produced; this is not evidence that tests discriminated a behavioral change."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi


      - name: Preserve mutation diagnostics
        if: ${{ always() && steps.mutation_scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            storage/framework/cache/infection-diff/summary.json
            storage/framework/cache/infection-diff/mutations.log
            storage/framework/cache/infection-diff/junit.xml
            storage/framework/cache/infection-diff/coverage-xml/**/*.xml

  clean-install:
    name: Clean install without secrets
    # Proves an outside contributor, with no repository secrets, can install and run SVC.
    # Never add a `secrets.` reference or a credential step to this job.
    runs-on: ubuntu-24.04-arm
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_EXPECT_DRIVER: sqlite
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          pnpm install --frozen-lockfile
          test -f .env || cp .env.example .env
          php artisan key:generate --ansi

      - name: Smoke the installed application
        run: |
          php artisan about
          php artisan test tests/Unit/Deployment
          pnpm run types:check

  dependency-audit:
    name: Dependency audit (advisory)
    # Advisory: not a need of `ci`, so a newly published advisory cannot block unrelated work.
    # Read the report and update the named package; do not weaken the audit.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      # Each audit reports as a warning annotation and never turns the check red: a red
      # advisory check on every pull request would read as a failing candidate.
      - name: Audit Composer lock file
        run: |
          if ! composer audit --locked --no-interaction; then
            echo "::warning title=Composer advisories::composer audit --locked reports advisories; read the log above and update the named packages."
          fi

      - name: Audit production pnpm dependencies
        run: |
          if ! pnpm audit --prod; then
            echo "::warning title=pnpm advisories::pnpm audit --prod reports advisories; read the log above and update the named packages."
          fi

  mariadb:
    name: Tests on MariaDB
    needs: [mariadb-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every MariaDB shard
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/require-success.sh

  ci:
    needs: [checks, sqlite, mariadb, mcp-smoke, layout-gate, clean-install]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all required CI lanes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/require-success.sh

  deploy:
    name: Deploy SVC to web1
    needs: [ci, mariadb, mcp-smoke]
    # The operator can pause deployment during account cutover. Stable-directory activation
    # preserves the real application path required by cPanel/LiteSpeed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.ATOMIC_DEPLOY_ENABLED == 'true' && needs.ci.result == 'success' && needs.mariadb.result == 'success' && needs.mcp-smoke.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: web1
    concurrency:
      group: svc-production-web1
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Install the pinned production-smoke client
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download frontend build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: public/build/

      # Shared deploy for Laravel on a cPanel account: https://github.com/bherila/shared-cpanel-deployment
      # (its README lists every input and what each guard refuses). Pin the action to a reviewed
      # commit; its deployment key belongs only to this application's cPanel account.
      #
      # v2.1.2 builds and validates a versioned candidate before selecting it beneath a real cPanel
      # application directory, keeps the previous release, and records the exact selected commit.
      # A migration or live OAuth/MCP verification failure restores the retained prior release
      # and its scheduler entries; migrations must remain compatible with prior code.
      #
      # All of storage is shared across releases, including authoritative svc-blobs and the OAuth key
      # pair. The action refuses an incomplete key pair rather than rotating it. SVC has a scheduler but
      # deliberately no queue worker; quiesce.sh drains only this app's in-flight Artisan processes.
      - name: Deploy to the cPanel account
        id: deploy
        uses: bherila/shared-cpanel-deployment@5798879af588e2c786357b69b314d89932b75803 # v2.6.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: svc-laravel
          # The dedicated account's primary public_html link is provisioned separately.
          # Stable-directory activation preserves its target; never ask the action to replace it.
          site-url: https://svc.bherila.net
          deployment-mode: atomic
          atomic-layout: stable-directory
          persistent-paths: storage
          # Keep rollback material until finalization; discard inactive code once serving is proven.
          retain-releases: '0'
          # Preserve previous-code compatibility when adding migrations; rollback keeps shared data.
          failure-policy: rollback
          initial-live-commit: f997a89fb5ce83ea2346d1267dc6f54f11ec9f2a
          # Normally empty. Set only to the exact owner reported by a failed atomic
          # run; recovery finalizes it and proves the selected app serves before retrying.
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          env-source: .config/svc/deployment.env
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          operational-audit: 'true'
          runtime-audit: 'true'
          # The action owns SVC's one scheduler line (owner decision on #327): it pauses it before
          # maintenance, replaces any legacy `cd "$HOME/svc-laravel"` line and installs the canonical
          # 1G `schedule:run` line once serving is proven. There is no queue worker, so no extra lines.
          # verify-live.sh then requires exactly one canonical line before the release is healthy.
          install-cron: 'true'
          cron-memory-limit: 1G
          preflight-script: scripts/deploy/preflight.sh
          quiesce-script: scripts/deploy/quiesce.sh
          pre-migrate-script: scripts/deploy/pre-migrate.sh
          post-deploy-script: scripts/deploy/post-deploy.sh
          verification-script: scripts/deploy/verify-live.sh
          post-finalize-script: scripts/deploy/post-finalize.sh

      - name: Report failed deployment and public service state
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        env:
          DEPLOY_LIVE_RELEASE: ${{ steps.deploy.outputs.live-release }}
          DEPLOY_LIVE_COMMIT: ${{ steps.deploy.outputs.live-commit }}
          DEPLOY_LIVE_STATE: ${{ steps.deploy.outputs.live-state }}
        run: bash scripts/deploy/report-failure.sh

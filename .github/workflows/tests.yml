# Both database lanes run the PHP suite with four ParaTest workers. Laravel gives
# each MariaDB worker an isolated `svc_testing_test_<token>` schema, created
# automatically by the root CI connection inside the ephemeral service container.
name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Setup Application
        run: composer setup

      - name: Test deployment hooks
        run: |
          for hook in scripts/deploy/*.sh tests/Deployment/*.sh; do bash -n "$hook"; done
          tests/Deployment/test-deploy-hooks.sh
          bash tests/Deployment/test-preflight.sh
          node --test tests/Deployment/verify-oauth-redirect.test.mjs

      - name: Run CI Checks
        run: composer ci:check

      - name: Upload frontend build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: public/build/
          retention-days: 2

  mariadb:
    name: Tests on MariaDB
    runs-on: ubuntu-24.04-arm

    # The default suite runs on in-memory SQLite; production is MariaDB 10.6
    # reached through Laravel's `mariadb` driver. SQLite stores whatever it is
    # handed, so a value MariaDB refuses passes there without comment - which is
    # how a `h:mm` string written into a decimal column survived 404 green
    # tests. Every schema difference between the two engines is invisible until
    # the suite runs on the engine that ships.
    #
    # This job is deliberately separate from `ci` rather than replacing its
    # database: SQLite keeps the local and CI feedback loop fast, and this run
    # is the one that has to be true.
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: svc_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # PHPUnit's <env> entries do not overwrite variables already present in the
    # environment, so these win over the sqlite defaults in phpunit.xml without
    # needing a second config file to drift out of step.
    #
    # DB_EXPECT_DRIVER is not read by the application. It tells the suite what
    # this run is claiming to be, and DatabaseDriverTest fails if the claim is
    # wrong - otherwise a mistyped variable or a service container that never
    # came up would quietly fall back to SQLite and report a green run that
    # proved nothing.
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: svc_testing
      DB_USERNAME: root
      DB_PASSWORD: testing
      DB_EXPECT_DRIVER: mariadb

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      # No --prefer-dist: the private bridge dependency is authorised by the SSH
      # agent above, and a dist install would fetch it from the GitHub API
      # zipball instead, which that key does not authenticate.
      - name: Install Composer dependencies
        run: |
          composer install --no-interaction
          test -f .env || cp .env.example .env

      # No lint or static analysis here; `ci` already runs those and they say
      # nothing about the engine. This job exists for the database alone.
      - name: Run the test suite against MariaDB
        run: php artisan test --parallel --processes=4

  mcp-smoke:
    name: MCP SDK streamable HTTP smoke
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Install application and generate ephemeral OAuth keys
        run: |
          composer install --no-interaction
          pnpm install --frozen-lockfile
          test -f .env || cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          install -d -m 700 storage/app/private/oauth
          php artisan passport:keys --force

      - name: Run pinned SDK MCP smoke
        run: bash scripts/mcp-smoke-ci.sh

  mutation:
    name: Diff-scoped mutation tests
    if: ${{ github.event_name == 'pull_request' }}
    continue-on-error: true
    # Typical diffs should remain near the ten-minute target. This is only the
    # hard failsafe for unusually broad money-path changes: #125 generated
    # 1,407 mutants and was cancelled by the former 12-minute cap before
    # Infection could report a result.
    timeout-minutes: 45
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mutation-tested changes
        id: mutation_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          diff_status=0
          git -c diff.renames=false diff --quiet --diff-filter=AM "$merge_base" "$HEAD_SHA" -- \
            ':(glob)app/**/*.php' || diff_status=$?
          if [ "$diff_status" -eq 0 ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "changed_count=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation gate not applicable::No added, modified, or renamed PHP application source under app/ is present in this diff."
            {
              echo "### Mutation gate"
              echo
              echo "Not run: this diff has no added, modified, or renamed PHP application source under \`app/\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$diff_status" -eq 1 ]; then
            changed_count=$(git -c diff.renames=false diff --name-only --diff-filter=AM "$merge_base" "$HEAD_SHA" -- ':(glob)app/**/*.php' | wc -l)
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
            {
              echo "### Mutation gate"
              echo
              echo "Running changed-line mutation analysis for $changed_count PHP application source file(s)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$diff_status"
          fi

      - name: Setup PHP with coverage
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov

      - name: Authorize private MCP bridge dependency
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Install Composer dependencies
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        run: composer install --no-interaction

      - name: Run mutations on changed lines
        id: mutation_run
        if: ${{ steps.mutation_scope.outputs.required == 'true' }}
        env:
          MUTATION_BASE: ${{ steps.mutation_scope.outputs.merge_base }}
        run: composer test:mutation-diff

      - name: Report mutation result
        if: ${{ always() && steps.mutation_scope.outputs.required == 'true' }}
        env:
          MUTATION_OUTCOME: ${{ steps.mutation_run.outcome }}
        run: |
          summary=storage/framework/cache/infection-diff/summary.json
          if [ ! -f "$summary" ]; then
            echo "::warning title=Mutation result unavailable::Infection did not produce its summary; inspect the mutation step output."
            {
              echo
              echo "Infection outcome: **$MUTATION_OUTCOME**. No result summary was produced; inspect the mutation step output."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(jq -r '.stats.totalMutantsCount' "$summary")
          killed=$(jq -r '.stats.killedCount' "$summary")
          escaped=$(jq -r '.stats.escapedCount' "$summary")
          covered_msi=$(jq -er '.stats.coveredCodeMsi // .coveredCodeMutationScoreIndicator' "$summary")

          if [ "$total" -eq 0 ]; then
            echo "::notice title=Mutation gate produced zero mutants::The changed PHP source was analyzed, but no covered changed line produced a mutant."
          fi

          {
            echo
            echo "Infection outcome: **$MUTATION_OUTCOME**. Mutants: **$total** total, **$killed** killed, **$escaped** escaped. Covered-code MSI: **$covered_msi%**."
            if [ "$total" -eq 0 ]; then
              echo
              echo "No mutants were produced; this is not evidence that tests discriminated a behavioral change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy empty alpha to web1
    needs: [ci, mariadb, mcp-smoke]
    # Keep production deploys explicitly disabled while the cPanel vhost requires
    # the configured application directory itself to remain a real directory.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.ATOMIC_DEPLOY_ENABLED == 'true' && needs.ci.result == 'success' && needs.mariadb.result == 'success' && needs.mcp-smoke.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    environment: web1
    concurrency:
      group: svc-production-web1
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate

      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Install the pinned production-smoke client
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: public/build/

      # Shared deploy for Laravel on a cPanel account: https://github.com/bherila/shared-cpanel-deployment
      # (its README lists every input and what each guard refuses). Pinned to a commit because this job
      # holds a key that reaches every application on the account.
      #
      # v2.1.2 builds and validates a versioned candidate before selecting it beneath a real cPanel
      # application directory, keeps the previous release, and records the exact selected commit.
      # A migration or live OAuth/MCP verification failure leaves the selected release in maintenance
      # for an explicit operator decision.
      #
      # All of storage is shared across releases, including authoritative svc-blobs and the OAuth key
      # pair. The action refuses an incomplete key pair rather than rotating it. SVC has a scheduler but
      # deliberately no queue worker; quiesce.sh drains only this app's in-flight Artisan processes.
      - name: Deploy to the cPanel account
        uses: bherila/shared-cpanel-deployment@3c0cc99456d79d06537aa97a410c06f10da01699 # v2.2.0
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-dir: svc-laravel
          site-url: https://svc.bherila.net
          deployment-mode: atomic
          atomic-layout: stable-directory
          persistent-paths: storage
          retain-releases: '3'
          failure-policy: maintenance
          initial-live-commit: f997a89fb5ce83ea2346d1267dc6f54f11ec9f2a
          # Normally empty. Set only to the exact owner reported by a failed atomic
          # run; recovery finalizes it and proves the selected app serves before retrying.
          recovery-release-id: ${{ vars.ATOMIC_RECOVERY_RELEASE_ID }}
          env-source: .config/svc/deployment.env
          passport-key-directory: storage/app/private/oauth
          artisan-memory-limit: 1G
          operational-audit: 'true'
          preflight-script: scripts/deploy/preflight.sh
          quiesce-script: scripts/deploy/quiesce.sh
          pre-migrate-script: scripts/deploy/pre-migrate.sh
          post-deploy-script: scripts/deploy/post-deploy.sh
          verification-script: scripts/deploy/verify-live.sh

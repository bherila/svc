name: data-safety

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  data-safety:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Test disclosure guard
        run: node scripts/test-sensitive-scan.mjs

      - name: Scan repository
        run: node scripts/scan-sensitive.mjs

# Generate a reviewable synthetic candidate. The required database jobs continue
# to compare the checked-in fixture without this generation flag.
name: MCP visibility snapshot candidate

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-visibility-candidate.yml'
      - 'tests/Feature/Mcp/AgentMcpVisibilitySnapshotTest.php'

permissions:
  contents: read

concurrency:
  group: mcp-visibility-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-candidate:
    runs-on: ubuntu-24.04-arm
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_EXPECT_DRIVER: sqlite
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Authorize private MCP bridge dependency
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MCP_BRIDGE_DEPLOY_KEY }}
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}
      - name: Install dependencies
        run: |
          composer install --no-interaction
          test -f .env || cp .env.example .env
      - name: Generate synthetic visibility candidate
        env:
          SVC_UPDATE_MCP_VISIBILITY_SNAPSHOT: '1'
        run: php -d memory_limit=1G artisan test tests/Feature/Mcp/AgentMcpVisibilitySnapshotTest.php
      - name: Upload candidate for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-visibility-snapshot-candidate
          path: tests/Fixtures/Mcp/visibility-snapshot.json
          retention-days: 7

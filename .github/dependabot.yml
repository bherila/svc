version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-compatible:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint does not yet support the TypeScript 7 compiler API.
      - dependency-name: typescript
        versions:
          - '>=7.0.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
